name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('posts.json', 'utf8'))"
          node -e "const p=JSON.parse(require('fs').readFileSync('posts.json','utf8')); const a=['popular-science','research-methods','data-analysis','ai-tools']; if(p.some(x=>!a.includes(x.category)||!Array.isArray(x.tags))) throw Error('Invalid article category or tags')"
          test -s posts/publications.md
          grep -q '<!-- SIMPLE -->' posts/research-update-1.md
          grep -q '<!-- PROFESSIONAL -->' posts/research-update-1.md
          grep -q '<!-- SIMPLE -->' posts/first-ai-code.md
          grep -q '<!-- PROFESSIONAL -->' posts/first-ai-code.md
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
