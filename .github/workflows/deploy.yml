name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('posts.json', 'utf8'))"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('posts.json','utf8')); const a=['popular-science','research-methods','data-analysis','ai-tools']; for(const x of p){const f='posts/'+x.id+'.md'; if(!a.includes(x.category)||!Array.isArray(x.tags)) throw Error('Invalid metadata: '+x.id); if(!fs.existsSync(f)) throw Error('Missing article: '+f); const s=fs.readFileSync(f,'utf8'); if(!s.includes('<!-- SIMPLE -->')||!s.includes('<!-- PROFESSIONAL -->')) throw Error('Missing versions: '+f)}"
          test -s posts/publications.md
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
